apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticket-app-dev

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: api-configmap.yaml
  - path: worker-configmap.yaml

nameSuffix: -dev

replicas:
  - name: api
    count: 1
  - name: frontend
    count: 1
  - name: worker
    count: 1
