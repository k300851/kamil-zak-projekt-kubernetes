apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticket-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      namespace: ticket-app
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.6.3-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
